; ==========================================
; .user.ini - Konfigurasi PHP untuk HMTI
; ==========================================
; File ini dibaca otomatis oleh PHP di cPanel.
; Kalau pake hosting lain, bisa juga via .htaccess:
;
;   php_value upload_max_filesize 100M
;   php_value post_max_size 105M
;   php_value max_execution_time 300
;   php_value max_input_time 300
;   php_value memory_limit 128M
; ==========================================

upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 300
max_input_time = 300
memory_limit = 128M

; ==========================================
; KEAMANAN (berlaku untuk cPanel/hosting PHP-FPM)
; ==========================================
; Cookie session tidak bisa dibaca JavaScript (anti XSS cookie theft)
session.cookie_httponly = 1
; Hanya simpan session di cookie (bukan via URL, biar tidak terjadi session fixation)
session.use_only_cookies = 1
; Batasi kirim cookie hanya untuk request same-site (anti CSRF)
session.cookie_samesite = "Lax"
; Jangan tampilkan versi PHP di header server
expose_php = Off
; Jangan tampilkan error detail ke pengunjung
display_errors = Off
log_errors = On
